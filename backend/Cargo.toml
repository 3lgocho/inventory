[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"

chrono = { version = "0.4", features = ["serde"] }

# SQLx configurado para MySQL y Tokio
[dependencies.sqlx]
version = "0.7"
features = [
    "runtime-tokio-rustls",
    "mysql",
    "json",
    "macros"
]